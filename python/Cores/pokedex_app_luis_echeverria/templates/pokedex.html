<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>


    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


</head>


<body>


    <!-- Barra superior -->
    <header class="top-nav">

        <button class="theme-toggle" id="themeBtn">
            <i class="fa-solid fa-sun" id="themeIcon"></i>
        </button>


        <button class="exit-btn">
            Salir
        </button>

    </header>



    <main class="container">


        <!-- Titulo -->

        <section class="header-title">

            <h1>
                🔴 Pokédex
            </h1>


            <p>
                Mostrando {{ pokemones|length }} Pokémon
            </p>

        </section>



        <!-- Botones -->

        <section class="filter-buttons">


            <a href="/pokemon" class="btn btn-blue">

                <i class="fa-solid fa-list"></i>

                Ver todos

            </a>



            <a href="/pokemon/cantidad/5" class="btn btn-green">

                <i class="fa-solid fa-filter"></i>

                Ver 5 primeros

            </a>


        </section>





        <!-- Cartas Pokémon -->

        <section class="pokemon-grid">


            {% for p in pokemones %}



            <article class="card">



                <!-- Imagen y número -->

                <div class="card-header">


                    <span class="badge-id">
                        #{{p.id}}
                    </span>



                    <img src="{{ url_for('static', filename='img/' + p.imagen) }}" alt="{{p.nombre}}">


                </div>





                <!-- Información -->

                <div class="card-body">


                    <h3>
                        {{p.nombre}}
                    </h3>



                    <div class="types">


                        <span class="type">

                            {{p.tipo}}

                        </span>


                    </div>




                    <!-- Poder -->

                    <div class="stats">


                        <p>

                            <i class="fa-solid fa-bolt"></i>

                            Poder: {{p.poder}}

                        </p>



                        <div class="progress-bar">


                            <div class="progress" style="width: {{ p.poder / 2 }}%;"></div>



                        </div>


                    </div>



                    <!-- Datos -->

                    <div class="details-row">


                        <div>

                            <small>
                                📏 Altura
                            </small>

                            <strong>
                                {{p.altura}}
                            </strong>


                        </div>




                        <div>

                            <small>
                                ⚖️ Peso
                            </small>

                            <strong>
                                {{p.peso}}
                            </strong>


                        </div>



                    </div>





                    <button class="btn-details">

                        Ver detalles

                    </button>



                </div>



            </article>




            {% endfor %}



        </section>



    </main>





    <script src="{{ url_for('static', filename='js/script.js') }}">
    </script>


</body>

</html>
